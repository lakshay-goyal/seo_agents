[project]
name = "seo-agents"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Lakshay Goyal", email = "lakshaygoyal201@gmail.com" }
]
requires-python = ">=3.14"
dependencies = ["python-dotenv>=1.0", "langchain>=1.0,<2.0", "langchain-core>=1.0,<2.0", "langgraph>=1.0,<2.0", "langchain-openai>=1.0", "beautifulsoup4>=4.12", "lxml>=5.0", "tree-sitter==0.25.2", "tree-sitter-javascript==0.25.0", "tree-sitter-typescript==0.23.2"]

[project.scripts]
seo-agents = "seo_agents.main:main"

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"
